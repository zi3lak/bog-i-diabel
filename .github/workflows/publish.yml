name: BÓG i DIABEŁ (publish)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Co 6 godzin — strona sama sie odswieza na wypadek, gdyby push
  # z lokalnego boxu nie doszedl (restart, brak sieci, limit rate).
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bog-i-diabel-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
